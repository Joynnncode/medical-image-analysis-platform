services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medimg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medimg_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-medimg}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medimg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    volumes:
      - ai-models:/app/models
    ports:
      - "8001:8001"

  api:
    build: ./backend/MedicalImageAnalysis.Api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-medimg};Username=${POSTGRES_USER:-medimg};Password=${POSTGRES_PASSWORD:-medimg_dev_password}
      Jwt__Key: ${JWT_KEY:-dev-only-secret-change-me-please-32chars-min}
      Jwt__Issuer: MedicalImageAnalysis
      AiService__BaseUrl: http://ai-service:8001
      Storage__Root: /app/storage
      Cors__AllowedOrigins__0: http://localhost:5173
    volumes:
      - api-storage:/app/storage
    ports:
      - "5283:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5283/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db-data:
  ai-models:
  api-storage:
